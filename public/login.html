<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<title>pi-web</title>
<style>
  :root { --bg:#0b0e12; --fg:#d4dee9; --dim:#79879a; --faint:#4d5a6b; --hair:#1b2431; --accent:#5fb0e8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-content: center; padding: 28px;
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  }
  form { width: 100%; max-width: 300px; }
  .mark { font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 22px; }
  input {
    width: 100%; padding: 9px 0; border: 0; border-bottom: 1px solid var(--hair);
    background: none; color: var(--fg); font-size: 16px; border-radius: 0;
  }
  input::placeholder { color: var(--faint); }
  input:focus { outline: none; border-bottom-color: var(--accent); }
  .row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px; }
  .err { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #e8807f; }
  button { border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; padding: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="mark">pi-web</div>
  <input type="password" name="password" placeholder="WEB_PASS" autocomplete="current-password" autofocus required>
  <div class="row">
    <span class="err" id="err" hidden>密码错误</span>
    <button type="submit">进入 →</button>
  </div>
</form>
<script>
  if (location.search.includes('e=1')) document.getElementById('err').hidden = false;
</script>
</body>
</html>
